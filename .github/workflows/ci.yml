name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libssl-dev libx11-dev libxi-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev
      - name: Build and test
        run: make test

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make libssl-dev libx11-dev libxi-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev
      - name: ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          make clean test-core test-media test-video-capture test-input test-net test-session test-hardening
          CXX=clang++
          CXXFLAGS='-std=c++20 -O1 -g -Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer'

  thread-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libssl-dev libx11-dev libxi-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev
      - name: TSan session supervisor
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: >-
          make clean test-session
          CXX=g++
          CXXFLAGS='-std=c++20 -O1 -g -Wall -Wextra -Wpedantic -fsanitize=thread -fno-omit-frame-pointer'

  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libssl-dev libx11-dev libxi-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev
      - name: Reconnect and transport stress
        run: |
          make all test-net test-session test-tunnel-recovery
          for i in 1 2 3; do
            make test-session test-net
          done
