name: CI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - tests/test_session.cpp
      - tests/test_direct_video_pipeline.cpp
      - include/opal/video_receiver.hpp
      - src/video_receiver.cpp
      - src/direct_video_session.cpp
  workflow_dispatch:
    inputs:
      target:
        description: Verification gate to run
        required: true
        default: full
        type: choice
        options:
          - full
          - linux
          - sanitize
          - thread-sanitize
          - stress

jobs:
  linux:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'linux') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libssl-dev libx11-dev libxi-dev libgl1-mesa-dev libpulse-dev xvfb ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - name: Build and test
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/opal-xvfb.log 2>&1 &
          DISPLAY=:99 make test

  sanitize:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'sanitize') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libssl-dev libx11-dev libxi-dev libgl1-mesa-dev libpulse-dev xvfb ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - name: ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/opal-xvfb.log 2>&1 &
          DISPLAY=:99 make clean test-direct-media-sanitize CXX=clang++ CXXFLAGS='-std=c++20 -O1 -g -Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer'

  thread-sanitize:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'thread-sanitize') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libssl-dev libx11-dev libxi-dev libgl1-mesa-dev libpulse-dev xvfb ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - name: TSan session and direct media
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: >-
          make clean test-session test-direct-video-session test-direct-video-stress
          CXX=g++
          CXXFLAGS='-std=c++20 -O1 -g -Wall -Wextra -Wpedantic -fsanitize=thread -fno-omit-frame-pointer'

  stress:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'stress')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libssl-dev libx11-dev libxi-dev libgl1-mesa-dev libpulse-dev xvfb ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - name: Reconnect and receiver probe
        if: ${{ github.event_name == 'push' }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/opal-xvfb.log 2>&1 &
          DISPLAY=:99 make test-session
          for i in $(seq 1 4); do
            echo "=== reconnect binary probe $i ==="
            DISPLAY=:99 ./build/test-session
          done
          DISPLAY=:99 make test-direct-video-pipeline
      - name: Direct-media reconnect and transport stress
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/opal-xvfb.log 2>&1 &
          DISPLAY=:99 make all test-net test-session test-direct-video-session test-direct-video-pipeline test-direct-video-stress test-tunnel-recovery
          for i in 1 2 3; do
            DISPLAY=:99 make test-session test-direct-video-stress
          done
